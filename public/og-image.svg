<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#7b2cbf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Logo/avatar circle -->
  <g transform="translate(120, 200)">
    <circle r="80" fill="rgba(0, 245, 212, 0.1)" stroke="#00f5d4" stroke-width="2"/>
    <text x="0" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="60" fill="#00f5d4" font-weight="bold">T</text>
  </g>

  <!-- Text content -->
  <g transform="translate(120, 350)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text font-size="36" fill="#00f5d4" font-weight="600" letter-spacing="2">DO MINH TUAN</text>
    <text y="80" font-size="68" fill="#ffffff" font-weight="800" letter-spacing="-1">Senior Project Manager</text>
    <text y="160" font-size="68" fill="#ffffff" font-weight="800" letter-spacing="-1">&amp; Tech Leader</text>
    <text y="220" font-size="22" fill="#888888" font-weight="400">15+ years • Web • Mobile • Agile • Vietnam Tech</text>
  </g>

  <!-- Decorative accent bar -->
  <rect x="120" y="500" width="120" height="4" fill="url(#accent)" rx="2"/>
  <text x="260" y="510" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#666666">me.tony.do</text>
</svg>
