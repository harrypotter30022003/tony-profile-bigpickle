<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tony CMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0a0a0f;color:#e0e0e0;min-height:100vh;padding:2rem}
.box{background:#12121a;border:1px solid #333;border-radius:10px;padding:1.5rem;margin-bottom:1rem}
input,textarea{width:100%;padding:0.7rem;background:#1a1a2e;border:1px solid #333;color:#fff;border-radius:6px;margin-bottom:0.8rem}
label{display:block;margin-bottom:0.4rem;color:#888;font-size:0.85rem}
button{padding:0.8rem 1.5rem;background:linear-gradient(135deg,#00f5d4,#7b2cbf);border:none;border-radius:6px;color:#000;font-weight:bold;cursor:pointer;margin-right:0.5rem}
.btn-del{background:#ff006e;color:#fff;padding:0.3rem 0.6rem;border:none;border-radius:4px;cursor:pointer}
.btn-add{background:transparent;border:1px dashed #444;color:#666;width:100%;padding:1rem;text-align:center}
.error{background:#3a1a1a;border:1px solid #ff006e;color:#ff006e;padding:1rem;border-radius:8px;margin-bottom:1rem}
.success{background:#1a3a2a;border:1px solid #00f5d4;color:#00f5d4;padding:1rem;border-radius:8px;margin-bottom:1rem}
.nav{display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.nav button{padding:0.5rem 1rem;font-size:0.85rem;background:#333;color:#888;border:1px solid #333}
.nav button.active{border-color:#00f5d4;color:#00f5d4}
.tab{display:none}.tab.active{display:block}
.item{background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:1rem;margin-bottom:1rem}
h1{color:#00f5d4;margin-bottom:0.5rem}h2{color:#00f5d4;margin:1.5rem 0 1rem;font-size:1.1rem}
</style>
</head>
<body>
<div id="app">Loading...</div>
<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return(h>>>0).toString(16)}

let session = localStorage.getItem('cms_token');
let data = null;

// Check token on load
if(session){
  // Verify token is still valid by trying to load data
  loadData();
} else {
  login();
}

function login(err){
  document.getElementById('app').innerHTML = '<div class="box"><h1>Login</h1>'+(err?'<div class="error">'+err+'</div>':'')+'<label>Password</label><input type="password" id="pw"><button onclick="doLogin()">Login</button></div>';
}

// Login via API (server validates password)
async function doLogin(){
  try {
    var pw = document.getElementById('pw').value;
    var res = await fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw})
    });
    var result = await res.json();
    if(result.token){
      session = result.token;
      localStorage.setItem('cms_token', result.token);
      loadData();
    } else {
      login('Invalid password');
    }
  } catch(e) {
    login('Error: ' + e.message);
  }
}

// Auto logout after 30 min of inactivity
let activityTimer;
function resetActivityTimer(){
  clearTimeout(activityTimer);
  activityTimer = setTimeout(() => {
    alert('Session expired. Please login again.');
    logout();
  }, 30 * 60 * 1000); // 30 minutes
}
['click','keypress','mousemove'].forEach(evt => {
  document.addEventListener(evt, resetActivityTimer);
});

function logout(){
  session = null;
  localStorage.removeItem('cms_token');
  localStorage.removeItem('cms_session');
  login();
}

// Load from API (relative - works local and Vercel)
const API_BASE = '';

async function loadData(){
  try {
    var res = await fetch(API_BASE + '/api/data');
    data = await res.json();
  } catch(e) {
    data = {name:'',title:'',summary:'',email:'',phone:'',linkedin:'',
      hero:{greeting:''},experience:[],skills:{},projects:[]};
  }
  render();
}

// Read form values into data object
function updateDataFromForm(){
  data.name = document.getElementById('d_name').value;
  data.title = document.getElementById('d_title').value;
  data.summary = document.getElementById('d_summary').value;
  data.email = document.getElementById('d_email').value;
  data.phone = document.getElementById('d_phone').value;
  data.linkedin = document.getElementById('d_linkedin').value;
  data.hero = data.hero || {};
  data.hero.greeting = document.getElementById('d_hero_greeting').value;
  data.hero.ctaPrimary = document.getElementById('d_hero_cta1').value;
  data.hero.ctaSecondary = document.getElementById('d_hero_cta2').value;
  data.skills = data.skills || {};
  data.skills['Project Management'] = (document.getElementById('s_pm').value || '').split(',').map(s => s.trim());
  data.skills['Web Development'] = (document.getElementById('s_web').value || '').split(',').map(s => s.trim());
  data.skills['Mobile'] = (document.getElementById('s_mobile').value || '').split(',').map(s => s.trim());
  data.skills['Infrastructure'] = (document.getElementById('s_infra').value || '').split(',').map(s => s.trim());
  data.footer = data.footer || {};
  data.footer.text = document.getElementById('d_footer_text').value;
  data.footer.year = document.getElementById('d_footer_year').value;
}

// Save to API
async function save(){
  try {
    updateDataFromForm();
    console.log('Saving to:', API_BASE + '/api/save');
    console.log('Data keys:', Object.keys(data));
    console.log('Saving name:', data.name);
    var token = localStorage.getItem('cms_token');
var payload = {token: token, data: data};
    console.log('Payload password:', payload.password);
    var res = await fetch(API_BASE + '/api/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    var result = await res.json();
    console.log('Result:', result);
    if(result.success){
      document.getElementById('status').innerHTML = '<div class="success">✓ Saved! Refresh page to see updated content.</div>';
    } else {
      document.getElementById('status').innerHTML = '<div class="error">'+result.error+'</div>';
    }
  } catch(e) {
    console.log('Error:', e);
    document.getElementById('status').innerHTML = '<div class="error">Error: '+e.message+'</div>';
  }
}

function switchTab(t){
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('active')});
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
  event.target.classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
}

function addExp(){data.experience.push({company:'',position:'',period:''});renderExp();}
function deleteExp(i){data.experience.splice(i,1);renderExp();}
function renderExp(){
  var el = document.getElementById('exp_list');
  var html = '<h2>Experience</h2>';
  for(var i=0; i<data.experience.length; i++){
    var e = data.experience[i];
    html += '<div class="item"><button class="btn-del" onclick="deleteExp('+i+')">X</button>';
    html += '<input placeholder="Company" value="'+esc(e.company)+'" onchange="data.experience['+i+'].company=this.value">';
    html += '<input placeholder="Position" value="'+esc(e.position)+'" onchange="data.experience['+i+'].position=this.value">';
    html += '<input placeholder="Period" value="'+esc(e.period)+'" onchange="data.experience['+i+'].period=this.value"></div>';
  }
  el.innerHTML = html;
}

function addProj(){data.projects.push({name:'',link:'',desc:'',tags:[]});renderProj();}
function deleteProj(i){data.projects.splice(i,1);renderProj();}
function renderProj(){
  var el = document.getElementById('proj_list');
  var html = '<h2>Projects</h2>';
  for(var i=0; i<data.projects.length; i++){
    var p = data.projects[i];
    html += '<div class="item"><button class="btn-del" onclick="deleteProj('+i+')">X</button>';
    html += '<input placeholder="Name" value="'+esc(p.name)+'" onchange="data.projects['+i+'].name=this.value">';
    html += '<textarea placeholder="Description" onchange="data.projects['+i+'].desc=this.value">'+esc(p.desc)+'</textarea>';
    html += '<input placeholder="Link" value="'+esc(p.link)+'" onchange="data.projects['+i+'].link=this.value"></div>';
  }
  el.innerHTML = html;
}

function addBlog(){
  data.blog = data.blog || [];
  data.blog.push({
    title: '',
    slug: '',
    category: 'Tech Made Simple 💡',
    image: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80',
    date: new Date().toISOString().split('T')[0],
    author: data.name || 'Do Minh Tuan',
    summary: '',
    content: ''
  });
  renderBlog();
}
function deleteBlog(i){
  data.blog.splice(i,1);
  renderBlog();
}
function renderBlog(){
  var el = document.getElementById('blog_list');
  if(!el) return;
  var html = '<h2>Blog Articles</h2>';
  data.blog = data.blog || [];
  for(var i=0; i<data.blog.length; i++){
    var b = data.blog[i];
    b.category = b.category || 'Tech Made Simple 💡';
    b.image = b.image || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80';

    html += '<div class="item"><button class="btn-del" onclick="deleteBlog('+i+')">X</button>';
    html += '<label>Title</label><input placeholder="Article Title" value="'+esc(b.title)+'" onchange="data.blog['+i+'].title=this.value; if(!data.blog['+i+'].slug){ data.blog['+i+'].slug=this.value.toLowerCase().replace(/[^a-z0-9]+/g,\'-\').replace(/(^-|-$)/g,\'\'); renderBlog(); }">';
    html += '<label>Slug (SEO friendly URL path)</label><input placeholder="slug-url-path" value="'+esc(b.slug)+'" onchange="data.blog['+i+'].slug=this.value">';
    
    // Category Select Dropdown
    html += '<label>Category</label><select style="width:100%;padding:0.7rem;background:#1a1a2e;border:1px solid #333;color:#fff;border-radius:6px;margin-bottom:0.8rem" onchange="data.blog['+i+'].category=this.value">';
    var cats = ['Tech Made Simple 💡', 'Business Hackers 🚀', 'Future Pulse 🔮', 'Developer Corner 💻'];
    for(var j=0; j<cats.length; j++){
      var sel = b.category === cats[j] ? ' selected' : '';
      html += '<option value="'+cats[j]+'"'+sel+'>'+cats[j]+'</option>';
    }
    html += '</select>';

    html += '<label>Cover Image URL (Unsplash recommended)</label><input placeholder="https://images.unsplash.com/..." value="'+esc(b.image)+'" onchange="data.blog['+i+'].image=this.value">';
    html += '<label>Date</label><input placeholder="YYYY-MM-DD" value="'+esc(b.date)+'" onchange="data.blog['+i+'].date=this.value">';
    html += '<label>Author</label><input placeholder="Author Name" value="'+esc(b.author)+'" onchange="data.blog['+i+'].author=this.value">';
    html += '<label>Short Summary</label><textarea placeholder="Short summary describing the article..." onchange="data.blog['+i+'].summary=this.value">'+esc(b.summary)+'</textarea>';
    html += '<label>Content (Markdown/Text)</label><textarea placeholder="Full article content..." style="height: 250px" onchange="data.blog['+i+'].content=this.value">'+esc(b.content)+'</textarea></div>';
  }
  el.innerHTML = html;
}

function render(){
  var s = '<h1>CMS <button onclick="logout()" style="background:#333;color:#fff;margin-left:1rem">Logout</button></h1>';
  s += '<div class="nav"><button class="active" onclick="switchTab(\'basic\')"> Basic</button><button onclick="switchTab(\'hero\')">Hero</button><button onclick="switchTab(\'exp\')">Experience</button><button onclick="switchTab(\'skills\')">Skills</button><button onclick="switchTab(\'projects\')">Projects</button><button onclick="switchTab(\'blog\')">Blog</button><button onclick="switchTab(\'footer\')">Footer</button><button onclick="switchTab(\'usage\')">Usage & Subscribers</button></div>';
  
  s += '<div id="tab-basic" class="tab active"><div class="box"><h2>Basic</h2>';
  s += '<label>Name</label><input id="d_name"><label>Title</label><input id="d_title">';
  s += '<label>Summary</label><textarea id="d_summary"></textarea>';
  s += '<label>Email</label><input id="d_email"><label>Phone</label><input id="d_phone">';
  s += '<label>LinkedIn</label><input id="d_linkedin"></div></div>';
  
  s += '<div id="tab-hero" class="tab"><div class="box"><h2>Hero</h2>';
  s += '<label>Greeting</label><input id="d_hero_greeting"><label>Primary CTA</label><input id="d_hero_cta1"><label>Secondary CTA</label><input id="d_hero_cta2"></div></div>';
  
  s += '<div id="tab-exp" class="tab"><div class="box" id="exp_list"><h2>Experience</h2></div>';
  s += '<button class="btn-add" onclick="addExp()">+ Add</button></div>';
  
  s += '<div id="tab-skills" class="tab"><div class="box"><h2>Skills</h2>';
  s += '<label>Project Management</label><input id="s_pm"><label>Web Development</label><input id="s_web">';
  s += '<label>Mobile</label><input id="s_mobile"><label>Infrastructure</label><input id="s_infra"></div></div>';
  
  s += '<div id="tab-projects" class="tab"><div class="box" id="proj_list"><h2>Projects</h2></div>';
  s += '<button class="btn-add" onclick="addProj()">+ Add</button></div>';
  
  s += '<div id="tab-blog" class="tab"><div class="box" id="blog_list"><h2>Blog Articles</h2></div>';
  s += '<button class="btn-add" onclick="addBlog()">+ Add Article</button></div>';
  
  s += '<div id="tab-footer" class="tab"><div class="box"><h2>Footer</h2>';
  s += '<label>Footer Text</label><input id="d_footer_text"><label>Footer Year</label><input id="d_footer_year"></div></div>';
  
  s += '<div id="tab-usage" class="tab"><div class="box"><h2>Mailing List & API Usage Monitoring</h2>';
  s += '<div id="sub_list_container">Loading subscribers...</div>';
  s += '<h2>Cloud Providers & Free Tier Limits</h2>';
  s += '<div class="item" style="border-left: 4px solid #00f5d4; background: #1a1a2e; border-radius: 6px; padding: 1rem; margin-bottom: 1rem;"><strong>SendPulse SMTP (Newsletter Sends)</strong><br><span style="color:#aaa; font-size:0.9rem">• Limit: 15,000 emails/month (max 3,000 emails/day)<br>• Capacity: Up to 500 subscribers<br>• Sender Domain: contact@tony.do (Verified)</span></div>';
  s += '<div class="item" style="border-left: 4px solid #ff006e; background: #1a1a2e; border-radius: 6px; padding: 1rem; margin-bottom: 1rem;"><strong>Vercel KV / Upstash (Database Storage)</strong><br><span style="color:#aaa; font-size:0.9rem">• Limit: 3,000 requests/day<br>• Storage Capacity: 256 MB<br>• Usage: Core portfolio reads & subscriber storage</span></div>';
  s += '<div class="item" style="border-left: 4px solid #3a86ff; background: #1a1a2e; border-radius: 6px; padding: 1rem; margin-bottom: 1rem;"><strong>Google Gemini API (AI News Articles)</strong><br><span style="color:#aaa; font-size:0.9rem">• Limits on Gemini 1.5 Flash: 15 Requests per Minute (RPM)<br>• Day Quota: 1,500 Requests per Day (RPD)<br>• Cost: 100% Free on Flash Model</span></div>';
  s += '<div class="item" style="border-left: 4px solid #7b2cbf; background: #1a1a2e; border-radius: 6px; padding: 1rem; margin-bottom: 1rem;"><strong>Vercel Hosting Platform (Bandwidth & Build)</strong><br><span style="color:#aaa; font-size:0.9rem">• Limit: 100 GB Bandwidth/month<br>• Compute: 100 GB-Hours Serverless Execution/month<br>• Deploy Limit: 100 builds/day</span></div>';
  s += '<div class="item" style="border-left: 4px solid #f58220; background: #1a1a2e; border-radius: 6px; padding: 1rem; margin-bottom: 1rem;"><strong>Google Analytics 4 & Firebase Core (User Behavior)</strong><br><span style="color:#aaa; font-size:0.9rem">• Event limit: 10 million events/month per property<br>• Storage: Unlimited reporting data storage<br>• Cost: 100% Free with zero credit card restrictions</span></div>';
  s += '</div></div>';
  
  s += '<button onclick="save()">Save to Site</button><div id="status"></div>';
  document.getElementById('app').innerHTML = s;
  
  // Fill values from API data
  document.getElementById('d_name').value = data.name||'';
  document.getElementById('d_title').value = data.title||'';
  document.getElementById('d_summary').value = data.summary||'';
  document.getElementById('d_email').value = data.email||'';
  document.getElementById('d_phone').value = data.phone||'';
  document.getElementById('d_linkedin').value = data.linkedin||'';
  document.getElementById('d_hero_greeting').value = (data.hero&&data.hero.greeting)||'';
  document.getElementById('d_hero_cta1').value = (data.hero&&data.hero.ctaPrimary)||'';
  document.getElementById('d_hero_cta2').value = (data.hero&&data.hero.ctaSecondary)||'';
  document.getElementById('s_pm').value = (data.skills&&data.skills['Project Management']||[]).join(', ');
  document.getElementById('s_web').value = (data.skills&&data.skills['Web Development']||[]).join(', ');
  document.getElementById('s_mobile').value = (data.skills&&data.skills['Mobile']||[]).join(', ');
  document.getElementById('s_infra').value = (data.skills&&data.skills['Infrastructure']||[]).join(', ');
  document.getElementById('d_footer_text').value = (data.footer&&data.footer.text)||'';
  document.getElementById('d_footer_year').value = (data.footer&&data.footer.year)||'';
  
  renderExp();
  renderProj();
  renderBlog();
  loadSubscribers();
}

async function loadSubscribers() {
  const container = document.getElementById('sub_list_container');
  if (!container) return;
  try {
    const res = await fetch(API_BASE + '/api/subscribers?token=' + encodeURIComponent(session));
    const result = await res.json();
    if (result.success && Array.isArray(result.subscribers)) {
      const subs = result.subscribers;
      let html = '';
      
      if (result.smtpLimits) {
        const limit = result.smtpLimits.limit || 15000;
        const sent = result.smtpLimits.sent || 0;
        const left = result.smtpLimits.left || (limit - sent);
        const pct = (sent / limit * 100).toFixed(1);

        html += `<div style="border-left: 4px solid #00f5d4; background: #1a1a2e; border-radius: 8px; padding: 1.2rem; margin-bottom: 1.5rem; border: 1px solid #333; border-left-width: 4px;">`;
        html += `<h3 style="font-size: 1rem; color: #fff; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 8px; margin-top:0;"><span>⚡</span> Live SendPulse SMTP Sending Balance</h3>`;
        html += `<span style="font-size: 0.9rem; color: #aaa;">• Emails Sent This Month: <strong>${sent}</strong> / ${limit} (${pct}% used)<br>`;
        html += `• Emails Remaining: <strong>${left}</strong> / ${limit}</span><br>`;
        html += `<div style="width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; margin-top: 0.8rem;">`;
        html += `<div style="width: ${pct}%; height: 100%; background: #00f5d4; border-radius: 4px; transition: width 0.3s;"></div>`;
        html += `</div></div>`;
      }

      html += '<h2 style="margin-top: 0; margin-bottom: 1rem;">Active Subscribers List</h2>';
      if (subs.length === 0) {
        html += '<p style="color:#888; margin-bottom: 1.5rem;">No subscribers on your list yet. Start collecting emails using the blog widgets!</p>';
      } else {
        html += '<div style="max-height: 200px; overflow-y: auto; background: #1a1a2e; border: 1px solid #333; padding: 1rem; border-radius: 6px; margin-bottom: 1rem;">';
        html += '<table style="width: 100%; border-collapse: collapse; text-align: left;">';
        html += '<thead style="border-bottom: 2px solid #333; color: #888; font-size: 0.85rem;"><tr><th style="padding: 0.5rem;">Email Address</th><th style="padding: 0.5rem;">Subscribed Date</th></tr></thead><tbody>';
        subs.forEach(sub => {
          const date = new Date(sub.subscribedAt).toLocaleString();
          html += `<tr style="border-bottom: 1px solid #222;"><td style="padding: 0.6rem; font-weight: 500;">${esc(sub.email)}</td><td style="padding: 0.6rem; color: #888;">${date}</td></tr>`;
        });
        html += '</tbody></table></div>';
        html += `<p style="margin-bottom: 1rem; font-size: 0.95rem; color: #00f5d4;">📊 Total Subscribers: <strong>${subs.length}</strong> / 500 (Free limit capacity: ${(subs.length/500*100).toFixed(1)}%)</p>`;
        html += '<button onclick="exportSubscribersCSV()" style="margin-bottom: 1.5rem; background: #00f5d4; color: #000;">📥 Export Subscribers to CSV</button>';
      }
      
      container.innerHTML = html;
      window.activeSubscribersList = subs;
    } else {
      container.innerHTML = '<div class="error">' + (result.error || 'Failed to load subscribers') + '</div>';
    }
  } catch(e) {
    container.innerHTML = '<div class="error">Error loading subscribers: ' + e.message + '</div>';
  }
}

function exportSubscribersCSV() {
  const subs = window.activeSubscribersList;
  if (!Array.isArray(subs) || subs.length === 0) return;
  let csv = 'Email Address,Subscribed At\r\n';
  subs.forEach(sub => {
    csv += `${sub.email},${sub.subscribedAt}\r\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  link.setAttribute("href", url);
  link.setAttribute("download", "subscribers_mailing_list.csv");
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

if(!session){login();}else{loadData();}
</script>
</body>
</html>
